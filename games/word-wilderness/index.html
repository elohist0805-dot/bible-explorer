<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>文字曠野｜聖經探險家</title>
<meta name="description" content="聖經冷僻字中文輸入練習遊戲：在文字落地前輸入正確的字，守住曠野中的卷軸。">
<style>
:root{--ink:#43311f;--paper:#fff8e7;--sand:#e8c982;--sand2:#c99d54;--deep:#5f4025;--gold:#f0c35c;--red:#b95b45;--green:#6f8a58;--sky:#bfe4ec}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;color:var(--ink);background:linear-gradient(#b7e1ec 0 38%,#e9d39c 38% 100%);overflow:hidden}
button,input{font:inherit}.shell{height:100dvh;display:grid;grid-template-rows:auto 1fr;background:radial-gradient(circle at 70% 14%,#fff8bfaa 0 7%,transparent 8%),linear-gradient(#cbeef4 0 38%,#ead49b 38% 100%)}
.topbar{position:relative;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 14px;background:#fff9edeb;border-bottom:1px solid #6c4b2b22;backdrop-filter:blur(10px)}
.back{border:0;background:#7a5636;color:#fff;border-radius:12px;padding:9px 12px;font-weight:900;cursor:pointer}.brand{font-weight:950}.brand small{display:block;font-size:10px;letter-spacing:1.4px;color:#8b6a49}.topstats{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}.chip{min-width:74px;text-align:center;background:#f4e4bd;border:1px solid #d8bd7d;border-radius:12px;padding:6px 9px}.chip b{display:block;font-size:18px;line-height:1}.chip span{font-size:10px;font-weight:800;opacity:.72}
.game{position:relative;min-height:0;overflow:hidden}.skyGlow{position:absolute;inset:0;background:linear-gradient(180deg,transparent 0 55%,#b2834050 75%,#80552d80 100%);pointer-events:none}.dunes{position:absolute;left:-5%;right:-5%;bottom:0;height:34%;background:radial-gradient(80% 55% at 20% 100%,#d7b36c 0 60%,transparent 61%),radial-gradient(85% 50% at 72% 100%,#c89f5c 0 58%,transparent 59%);opacity:.96;pointer-events:none}.tent{position:absolute;right:5%;bottom:18%;width:150px;height:95px;opacity:.85;filter:drop-shadow(0 10px 10px #4f321633)}.tent:before{content:"";position:absolute;inset:18px 12px 0;background:#8b573b;clip-path:polygon(50% 0,100% 100%,0 100%)}.tent:after{content:"";position:absolute;left:67px;top:35px;width:16px;height:60px;background:#4f3528;clip-path:polygon(0 0,100% 0,70% 100%,30% 100%)}
.titlebox{position:absolute;z-index:5;left:16px;top:16px;max-width:min(480px,75vw);background:#fff9e9dd;border:1px solid #d6bd84;border-radius:18px;padding:12px 15px;box-shadow:0 10px 30px #50351e1c}.titlebox h1{margin:0;font-family:Georgia,"Noto Serif TC",serif;font-size:clamp(24px,4vw,38px)}.titlebox p{margin:5px 0 0;font-size:13px;line-height:1.55;color:#6b563d}.titlebox.hide{opacity:.22;transform:scale(.94);transform-origin:left top;transition:.3s}
.fallfield{position:absolute;inset:0 0 126px;overflow:hidden}.word{position:absolute;top:0;left:0;width:64px;height:64px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(145deg,#fffdf2,#f0d99e);border:2px solid #8d6737;box-shadow:0 8px 18px #4f34292d, inset 0 0 0 3px #fff7d8;color:#3f2d1d;font-family:"Noto Serif TC","PMingLiU",serif;font-size:36px;font-weight:900;will-change:transform}.word:before,.word:after{content:"";position:absolute;top:9px;bottom:9px;width:6px;border-radius:6px;background:#91683d}.word:before{left:-5px}.word:after{right:-5px}.word.danger{animation:pulse .65s infinite alternate;border-color:#b35642}.word.hit{animation:burst .32s forwards}@keyframes pulse{to{box-shadow:0 0 0 7px #c85b3c22,0 10px 22px #4f342944}}@keyframes burst{50%{transform:var(--pos) scale(1.28) rotate(6deg);filter:brightness(1.3)}100%{transform:var(--pos) scale(.05) rotate(25deg);opacity:0}}
.bottom{position:absolute;z-index:10;left:0;right:0;bottom:0;padding:10px 12px max(10px,env(safe-area-inset-bottom));background:linear-gradient(180deg,#4d331be8,#2f2116f4);color:#fff;box-shadow:0 -8px 24px #39231233}.dangerbar{height:38px;display:flex;align-items:center;gap:7px;margin-bottom:8px}.dangerbar strong{font-size:12px;white-space:nowrap;color:#f6d590}.slots{display:flex;gap:6px;flex:1}.slot{height:24px;flex:1;max-width:42px;border-radius:7px;border:1px dashed #f7d99d77;background:#ffffff0c;display:grid;place-items:center;font-weight:900}.slot.filled{background:#d76f50;color:#fff;border-style:solid}.inputrow{display:flex;align-items:center;gap:8px}.inputWrap{position:relative;flex:1}.typebox{width:100%;border:2px solid #efd18b;background:#fffdf5;color:#402d1f;border-radius:14px;padding:12px 14px;font-size:20px;outline:none;box-shadow:inset 0 2px 0 #00000009}.typebox:focus{border-color:#ffd978;box-shadow:0 0 0 4px #ffd97833}.hint{font-size:11px;color:#ead7b8;line-height:1.45;white-space:nowrap}.toast{position:absolute;z-index:30;left:50%;top:24%;transform:translate(-50%,-50%) scale(.9);background:#3f2d1fe8;color:#fff8de;border:1px solid #e6c67d;border-radius:15px;padding:11px 16px;opacity:0;pointer-events:none;font-weight:900;transition:.18s}.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.overlay{position:absolute;z-index:50;inset:0;background:#2d1d12c7;display:grid;place-items:center;padding:18px}.panel{width:min(560px,94vw);background:#fff8e8;border:2px solid #caa566;border-radius:24px;box-shadow:0 28px 80px #0007;padding:24px;text-align:center}.panel h2{font-family:Georgia,"Noto Serif TC",serif;font-size:34px;margin:0 0 8px}.panel p{line-height:1.7;color:#6b563d}.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.rule{background:#f3e4bf;border-radius:14px;padding:10px;font-size:12px;line-height:1.5}.rule b{display:block;font-size:22px}.start{border:0;border-radius:14px;background:#7a5636;color:#fff;font-weight:950;padding:13px 22px;font-size:18px;cursor:pointer;box-shadow:0 8px 18px #5d3e2744}.smallbtn{margin-left:8px;border:1px solid #a98755;border-radius:12px;background:#fffaf0;color:#5c432c;font-weight:900;padding:11px 15px;cursor:pointer}.scoregrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:14px 0}.scoregrid div{background:#f3e4bf;border-radius:12px;padding:10px}.scoregrid b{display:block;font-size:24px}.learned{margin-top:10px;text-align:left;background:#fffdf5;border:1px solid #e0c993;border-radius:14px;padding:10px;font-size:12px;line-height:1.7;max-height:110px;overflow:auto}.hidden{display:none!important}
@media(max-width:700px){.topbar{padding:8px}.brand{display:none}.chip{min-width:60px;padding:5px}.chip b{font-size:16px}.titlebox{top:10px;left:10px;max-width:86vw}.titlebox p{font-size:12px}.tent{right:-15px;bottom:20%;transform:scale(.78)}.fallfield{bottom:140px}.word{width:58px;height:58px;font-size:32px}.bottom{padding:8px}.inputrow{display:block}.hint{margin-top:6px;white-space:normal}.rules{grid-template-columns:1fr}.panel{padding:18px}.panel h2{font-size:29px}}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <button class="back" onclick="location.href='../../'">← 探險大廳</button>
    <div class="brand">文字曠野<small>BIBLE WORD WILDERNESS</small></div>
    <div class="topstats">
      <div class="chip"><b id="score">0</b><span>得分</span></div>
      <div class="chip"><b id="combo">0</b><span>連擊</span></div>
      <div class="chip"><b id="time">0:00</b><span>時間</span></div>
    </div>
  </header>
  <main class="game" id="game">
    <div class="skyGlow"></div><div class="dunes"></div><div class="tent"></div>
    <div class="titlebox" id="titlebox"><h1>文字曠野</h1><p>冷僻字正從天空落下。用你熟悉的中文輸入法輸入正確的字，在卷軸堆滿以前把它們收進記憶中。</p></div>
    <div class="fallfield" id="fallfield"></div>
    <div class="toast" id="toast"></div>
    <div class="bottom">
      <div class="dangerbar"><strong>曠野堆積</strong><div class="slots" id="slots"></div></div>
      <div class="inputrow">
        <div class="inputWrap"><input id="typebox" class="typebox" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="在這裡輸入落下的字…" aria-label="輸入聖經難字"></div>
        <div class="hint">支援注音、倉頡、拼音、嘸蝦米、手寫等輸入法<br>選字完成後即自動判定</div>
      </div>
    </div>
    <section class="overlay" id="startOverlay">
      <div class="panel">
        <div style="font-size:48px">📜</div><h2>文字曠野</h2>
        <p>聖經裡有許多平常不常使用的字。當文字從曠野上空落下時，請在它落地前輸入相同的中文字。</p>
        <div class="rules"><div class="rule"><b>⌨️</b>完成中文選字後<br>自動消除目標</div><div class="rule"><b>🔥</b>連續答對<br>累積連擊加分</div><div class="rule"><b>8</b>漏掉 8 個字<br>本次旅程結束</div></div>
        <button class="start" id="startBtn">開始穿越曠野</button>
      </div>
    </section>
    <section class="overlay hidden" id="endOverlay">
      <div class="panel"><div style="font-size:45px">🏺</div><h2>旅程結束</h2><p id="endLine">你已完成這次文字曠野的挑戰。</p><div class="scoregrid"><div><b id="finalScore">0</b>總得分</div><div><b id="finalHit">0</b>正確字數</div><div><b id="finalAcc">0%</b>正確率</div><div><b id="finalCombo">0</b>最高連擊</div></div><div class="learned" id="learned"></div><button class="start" id="againBtn">再走一次</button><button class="smallbtn" onclick="location.href='../../'">回探險大廳</button></div>
    </section>
  </main>
</div>
<script>
const BANK=[
['曠','曠野'],['幔','會幕的幔子'],['膏','膏油／膏立'],['櫃','約櫃'],['燔','燔祭'],['壇','祭壇'],['杖','摩西的杖'],['荊','荊棘'],['棘','荊棘'],['羔','逾越節羊羔'],['酵','無酵餅'],['蘸','蘸血'],['袍','祭司袍'],['踵','腳跟／後裔意象'],['俯','俯伏'],['匐','俯伏相關用字'],['磐','磐石'],['莢','皂莢木'],['橛','帳幕的橛子'],['鉤','金鉤／銀鉤'],['鏟','壇上的器具'],['盂','器皿'],['爵','杯爵／器皿'],['鬚','鬍鬚'],['鬢','兩鬢'],['篩','篩麥子'],['肋','肋骨'],['髓','骨髓'],['腓','腓利門等譯名用字'],['轄','車轄'],['鞍','驢鞍'],['褥','褥子'],['竿','竿子'],['皂','皂莢木'],['甕','甕器'],['鐃','鐃鈸'],['鈸','鐃鈸'],['磯','海邊磯石'],['鴿','鴿子'],['雛','雛鴿'],['鵪','鵪鶉'],['鶉','鵪鶉'],['蝗','蝗蟲'],['虻','虻蟲'],['疥','疥瘡'],['癬','癬疥'],['瘡','災病與醫治'],['骸','骸骨'],['轅','車轅'],['軛','負軛'],['錨','船錨'],['艙','船艙'],['篷','船篷'],['縵','布幔相關字'],['纛','旗幟古字'],['簸','簸箕'],['箕','簸箕'],['糠','糠秕'],['秕','糠秕'],['穗','麥穗'],['鐮','鐮刀'],['鋤','鋤頭'],['葡','葡萄'],['萄','葡萄'],['榨','酒榨'],['窖','酒窖'],['橄','橄欖'],['欖','橄欖'],['檀','檀香木'],['翡','翡翠']
];
const els={field:document.getElementById('fallfield'),input:document.getElementById('typebox'),score:document.getElementById('score'),combo:document.getElementById('combo'),time:document.getElementById('time'),slots:document.getElementById('slots'),toast:document.getElementById('toast'),title:document.getElementById('titlebox'),start:document.getElementById('startOverlay'),end:document.getElementById('endOverlay')};
let state,raf,last,spawnClock,isComposing=false,toastTimer;
function initSlots(){els.slots.innerHTML='';for(let i=0;i<8;i++){const s=document.createElement('div');s.className='slot';els.slots.appendChild(s)}}
function reset(){cancelAnimationFrame(raf);state={running:false,words:[],score:0,combo:0,maxCombo:0,hits:0,missInputs:0,fallen:0,startAt:0,elapsed:0,seen:new Map(),lastPick:-1};els.field.innerHTML='';els.score.textContent='0';els.combo.textContent='0';els.time.textContent='0:00';els.input.value='';initSlots();updateSlots();}
function startGame(){reset();state.running=true;state.startAt=performance.now();last=state.startAt;spawnClock=1100;els.start.classList.add('hidden');els.end.classList.add('hidden');els.title.classList.add('hide');els.input.focus();spawn();raf=requestAnimationFrame(loop)}
function pickWord(){let idx=Math.floor(Math.random()*BANK.length);if(BANK.length>1&&idx===state.lastPick)idx=(idx+1)%BANK.length;state.lastPick=idx;return BANK[idx]}
function spawn(){if(!state.running)return;const [char,label]=pickWord();const node=document.createElement('div');node.className='word';node.textContent=char;const max=Math.max(10,els.field.clientWidth-76);const x=10+Math.random()*Math.max(10,max-10);const obj={char,label,node,x,y:-74,speed:34+Math.random()*15+Math.min(48,state.elapsed*.55)};node.style.transform=`translate(${x}px,${obj.y}px)`;els.field.appendChild(node);state.words.push(obj)}
function loop(now){if(!state.running)return;const dt=Math.min(.05,(now-last)/1000);last=now;state.elapsed=(now-state.startAt)/1000;spawnClock-=dt*1000;const interval=Math.max(520,1450-state.elapsed*8.5);if(spawnClock<=0){spawn();spawnClock=interval*(.8+Math.random()*.35)}const floor=els.field.clientHeight-68;for(let i=state.words.length-1;i>=0;i--){const w=state.words[i];w.y+=w.speed*dt;w.node.style.setProperty('--pos',`translate(${w.x}px,${w.y}px)`);w.node.style.transform=`translate(${w.x}px,${w.y}px)`;w.node.classList.toggle('danger',w.y>floor-120);if(w.y>=floor){land(w,i);if(!state.running)return}}updateTime();raf=requestAnimationFrame(loop)}
function land(w,i){w.node.remove();state.words.splice(i,1);state.fallen++;state.combo=0;els.combo.textContent='0';updateSlots();showToast(`${w.char} 落地了｜${w.label}`,false);if(state.fallen>=8)gameOver()}
function updateSlots(){[...els.slots.children].forEach((s,i)=>{s.classList.toggle('filled',i<state.fallen);s.textContent=i<state.fallen?'字':''})}
function updateTime(){const s=Math.floor(state.elapsed),m=Math.floor(s/60);els.time.textContent=`${m}:${String(s%60).padStart(2,'0')}`}
function processInput(){if(!state.running||isComposing)return;const text=els.input.value.trim();if(!text)return;els.input.value='';for(const ch of [...text])judge(ch)}
function judge(ch){const matches=state.words.map((w,i)=>({w,i})).filter(o=>o.w.char===ch).sort((a,b)=>b.w.y-a.w.y);if(matches.length){hit(matches[0].w,matches[0].i)}else{state.missInputs++;state.combo=0;els.combo.textContent='0';showToast(`「${ch}」目前不在曠野中`,false)}}
function hit(w,i){state.words.splice(i,1);state.hits++;state.combo++;state.maxCombo=Math.max(state.maxCombo,state.combo);const add=100+Math.min(400,(state.combo-1)*20);state.score+=add;els.score.textContent=state.score.toLocaleString('zh-TW');els.combo.textContent=state.combo;state.seen.set(w.char,w.label);w.node.classList.remove('danger');w.node.classList.add('hit');setTimeout(()=>w.node.remove(),320);showToast(`✓ ${w.char}｜${w.label}${state.combo>=3?`　${state.combo}連擊！`:''}`,true)}
function showToast(msg,good){clearTimeout(toastTimer);els.toast.textContent=msg;els.toast.style.background=good?'#536f3eea':'#5b3829ea';els.toast.classList.add('show');toastTimer=setTimeout(()=>els.toast.classList.remove('show'),1050)}
function gameOver(){state.running=false;cancelAnimationFrame(raf);state.words.forEach(w=>w.node.remove());state.words=[];const attempts=state.hits+state.missInputs;const acc=attempts?Math.round(state.hits/attempts*100):100;document.getElementById('finalScore').textContent=state.score.toLocaleString('zh-TW');document.getElementById('finalHit').textContent=state.hits;document.getElementById('finalAcc').textContent=acc+'%';document.getElementById('finalCombo').textContent=state.maxCombo;document.getElementById('endLine').textContent=`你在曠野中堅持了 ${els.time.textContent}，共收下 ${state.hits} 個文字。`;const learned=document.getElementById('learned');learned.innerHTML=state.seen.size?'<b>本局遇見的聖經用字：</b><br>'+[...state.seen].map(([c,l])=>`<b>${c}</b>・${l}`).join('　'):'這次還沒來得及收下文字，再試一次吧！';els.end.classList.remove('hidden');els.title.classList.remove('hide')}
els.input.addEventListener('compositionstart',()=>isComposing=true);els.input.addEventListener('compositionend',()=>{isComposing=false;setTimeout(processInput,0)});els.input.addEventListener('input',()=>{if(!isComposing)setTimeout(processInput,0)});els.input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!isComposing){e.preventDefault();processInput()}});document.getElementById('startBtn').onclick=startGame;document.getElementById('againBtn').onclick=startGame;window.addEventListener('resize',()=>{state?.words?.forEach(w=>{w.x=Math.min(w.x,Math.max(8,els.field.clientWidth-72))})});reset();
</script>
</body>
</html>
