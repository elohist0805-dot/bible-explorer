const events=[
{id:'a-ur',char:'abraham',place:'ur',title:'離開故鄉',story:'亞伯蘭原本和家人住在迦勒底的吾珥。後來他的父親他拉帶著家人離開吾珥，展開一段漫長的旅程。他們走了很長的路，最後暫時住在哈蘭。',q:'亞伯蘭一家離開吾珥時，原本要往哪裡去？',a:['迦南','埃及','所多瑪'],correct:0,reward:'pearl',ref:'創世記 11:27–31',lesson:'這趟從吾珥開始的遷移，成為亞伯蘭日後進入迦南的重要開端。'},
{id:'a-haran',char:'abraham',place:'haran',title:'神的呼召',story:'亞伯蘭住在哈蘭時，神給了他一個重要的呼召。他必須離開熟悉的地方，前往一個還不知道確切位置的地方。神同時給他一個很大的應許。',q:'面對神的呼召，亞伯蘭最重要的回應是什麼？',a:['照神的吩咐出發','留在哈蘭等待更多證據','先到埃及建立城市'],correct:0,reward:'gold',ref:'創世記 12:1–5',lesson:'亞伯蘭還沒有看見應許如何實現，就選擇相信神而出發。'},
{id:'a-shechem',char:'abraham',place:'shechem',title:'進入迦南',story:'經過漫長旅程，亞伯蘭終於進入迦南，來到示劍。就在這裡，神再次向他顯現。亞伯蘭知道，自己一路跟隨的神仍然與他同在。',q:'亞伯蘭在迦南築壇，最能表達什麼？',a:['敬拜向他顯現的神','宣布自己成為迦南王','準備建造新的城市'],correct:0,reward:'onyx',ref:'創世記 12:6–7',lesson:'築壇是亞伯蘭回應神、敬拜神的重要行動。'},
{id:'a-egypt',char:'abraham',place:'egypt',title:'饑荒與害怕',story:'迦南發生嚴重饑荒，亞伯蘭只好前往埃及暫住。可是到了埃及附近，他開始害怕自己會因撒萊而遭遇危險，因此作了一個不誠實的決定，結果反而帶來更多麻煩。',q:'亞伯蘭因為害怕，在埃及說了什麼謊？',a:['說撒萊是他的妹妹','說自己是埃及人','說自己沒有任何家人'],correct:0,reward:'pearl',ref:'創世記 12:10–20',lesson:'聖經沒有把信心人物寫成永遠不犯錯的人；亞伯蘭也曾因害怕作出不好的決定。'},
{id:'a-lot',char:'abraham',place:'bethel',title:'與羅得分地',story:'亞伯蘭和羅得的牲畜越來越多，牧人之間開始發生爭執。為了避免衝突繼續擴大，亞伯蘭主動提出一個解決方法，讓羅得先作選擇。',q:'亞伯蘭處理爭執的方式有什麼特別？',a:['他願意讓羅得先選','他把羅得趕走','他要求自己一定得到最好的土地'],correct:0,reward:'onyx',ref:'創世記 13:1–12',lesson:'亞伯蘭沒有堅持自己先得好處，而是選擇避免爭競。'},
{id:'a-covenant',char:'abraham',place:'hebron',title:'星空下的應許',story:'亞伯蘭年紀漸長，卻仍然沒有神所應許的兒子。他開始疑惑：神的應許究竟要怎樣實現？那天晚上，神帶他走到帳棚外，要他抬頭觀看夜空。',q:'神要亞伯蘭觀看滿天星星，主要是要幫助他明白什麼？',a:['他的後裔將非常多','他應該研究天文','他要搬到星星最多的地方'],correct:0,reward:'gold',ref:'創世記 15章',lesson:'當亞伯蘭還看不見應許實現時，神用滿天星辰幫助他相信將來的後裔。'},
{id:'a-sodom',char:'abraham',place:'sodom',title:'為所多瑪代求',story:'神讓亞伯拉罕知道所多瑪的罪惡十分嚴重。亞伯拉罕想到自己的姪兒羅得。',q:'亞伯拉罕接著怎麼做？',a:['為所多瑪向神代求','立刻帶軍隊攻打所多瑪','完全不理會就離開'],correct:0,reward:'onyx',ref:'創世記 18:16–33',lesson:'亞伯拉罕不是只想到自己，也為面臨審判的人向神代求。'},
{id:'a-isaac',char:'abraham',place:'beersheba',title:'以撒出生',story:'神曾應許亞伯拉罕和撒拉會有一個兒子，但他們等待了很多年，甚至已經年老。到了神所定的時候，一件他們曾經覺得幾乎不可能的事情終於發生。',q:'以撒的出生在亞伯拉罕的故事中最重要的意義是什麼？',a:['神正在實現祂的應許','亞伯拉罕終於成為國王','他們可以離開迦南'],correct:0,reward:'gold',ref:'創世記 21:1–7',lesson:'以撒的出生讓亞伯拉罕一家親眼看見：等待多年的應許真的開始實現。'},
{id:'a-moriah',char:'abraham',place:'moriah',title:'最大的考驗',story:'亞伯拉罕帶著以撒前往摩利亞地。這是一場非常艱難的考驗。當事情到了最關鍵的時刻，神阻止亞伯拉罕傷害以撒；亞伯拉罕隨後看見神已經有所預備。',q:'這個事件最後讓亞伯拉罕經歷到什麼？',a:['神會親自預備','以撒必須永遠住在摩利亞','只有昂貴的祭物神才接受'],correct:0,reward:'gold',ref:'創世記 22:1–19',lesson:'亞伯拉罕稱那地方為「耶和華以勒」，表達神會預備。'},
{id:'a-machpelah',char:'abraham',place:'hebron',title:'買下麥比拉洞',story:'撒拉去世後，亞伯拉罕需要一個地方安葬她。當地人願意提供土地，但亞伯拉罕堅持按照正式方式取得那塊田地，最後在眾人面前完成交易。',q:'亞伯拉罕為什麼堅持正式買下這塊土地？',a:['要取得屬於自己的安葬之地','要在那裡蓋王宮','要把土地轉賣賺錢'],correct:0,reward:'onyx',ref:'創世記 23章',lesson:'麥比拉成為亞伯拉罕家族在迦南正式擁有的重要土地，也成為家族的安葬之地。'},

{id:'i-moriah',char:'isaac',place:'moriah',title:'為以撒尋找妻子',story:'亞伯拉罕年老時，特別吩咐僕人不要為以撒娶迦南女子，而要回到他的本地、本族去尋找妻子。僕人於是往兩河流域出發，後來遇見了利百加。',q:'利百加是哪裡人？',a:['亞伯拉罕本族、住在兩河流域的人','埃及人','迦南人'],correct:0,reward:'gold',ref:'創世記 24:1–15',lesson:'利百加來自亞伯拉罕的親族；她離開家鄉來到迦南，後來成為以撒的妻子。'},
{id:'i-rebekah',char:'isaac',place:'lahairoi',title:'遇見利百加',story:'亞伯拉罕年老後，差遣僕人回到親族那裡，為以撒尋找妻子。經過漫長旅程，僕人帶著一位女子回到迦南。傍晚，以撒正在田間默想，看見遠處有駱駝走來。',q:'這位從遠方來到迦南、後來成為以撒妻子的女子是誰？',a:['利百加','拉結','利亞'],correct:0,reward:'onyx',ref:'創世記 24:62–67',lesson:'利百加離開自己的家鄉來到迦南，成為以撒的妻子，也進入神應許延續的家庭。'},
{id:'i-twins',char:'isaac',place:'lahairoi',title:'雙胞胎出生',story:'以撒和利百加結婚多年卻沒有孩子，以撒便為妻子祈求。後來利百加懷孕，而且腹中的兩個孩子彼此相爭。孩子出生時，一個先出生，另一個則抓著哥哥的腳跟。',q:'這對雙胞胎兄弟是誰？',a:['以掃和雅各','該隱和亞伯','以實瑪利和以撒'],correct:0,reward:'pearl',ref:'創世記 25:19–26',lesson:'先出生的是以掃，接著出生的是雅各。這對兄弟後來的故事也成為創世記的重要部分。'},
{id:'i-gerar',char:'isaac',place:'gerar',title:'饑荒中的選擇',story:'以撒居住的地方發生饑荒。他來到基拉耳，可能也像父親亞伯拉罕從前一樣，考慮往糧食較充足的地方去。這時，神向以撒顯現，給了他清楚的指示。',q:'神給以撒什麼吩咐？',a:['不要下埃及，要住在神所指示的地方','立刻下埃及躲避饑荒','回到哈蘭居住'],correct:0,reward:'onyx',ref:'創世記 26:1–6',lesson:'神吩咐以撒不要下埃及，要住在祂所指示的地方，並再次向以撒確認給亞伯拉罕的應許。'},
{id:'i-wells',char:'isaac',place:'gerar',title:'一次又一次挖井',story:'以撒在基拉耳一帶逐漸富足，引起當地人的嫉妒。後來他的僕人在谷中挖井，當地牧人卻來與他們爭奪。換了一個地方再挖，仍然發生爭執。',q:'面對一次又一次的爭井，以撒主要怎麼做？',a:['退讓，再到別處挖井','召集人馬搶回所有水井','從此不再挖井'],correct:0,reward:'pearl',ref:'創世記 26:19–21',lesson:'以撒有能力爭奪，卻沒有讓衝突不斷擴大，而是多次退讓，再尋找可以安居的地方。'},
{id:'i-rehoboth',char:'isaac',place:'rehoboth',title:'終於不再爭了',story:'以撒離開發生爭執的地方，又帶著僕人繼續挖井。這一次，他們終於找到水，而且沒有人再來爭奪。以撒便為這口井取了一個名字。',q:'「利河伯」是什麼意思？',a:['寬闊之地','爭戰之井','悲傷之地'],correct:0,reward:'onyx',ref:'創世記 26:22',lesson:'「利河伯」帶有「寬闊」的意思。以撒說，耶和華現在給他們寬闊之地，使他們在這地昌盛。'},
{id:'i-beer',char:'isaac',place:'beersheba',title:'神再次顯現',story:'以撒來到別是巴。當天晚上，神向他顯現，再次提到祂與亞伯拉罕的關係，也再次確認對以撒的應許。經歷這件事之後，以撒用實際的行動回應神。',q:'神向以撒顯現後，以撒做了什麼？',a:['築壇並求告耶和華的名','立刻離開迦南','建造王宮自立為王'],correct:0,reward:'gold',ref:'創世記 26:23–25',lesson:'以撒在別是巴築壇、求告耶和華的名，也在那裡支搭帳棚。他不只是聽見神的應許，也以敬拜回應神。'},

{id:'j-blessing',char:'jacob',place:'beersheba',title:'帶著祝福離家',story:'雅各照著母親利百加的安排，穿上以掃的衣服，到年老眼花的以撒面前，得到了原本要給以掃的祝福。以掃非常生氣，雅各只好離開家。',q:'雅各為什麼離開別是巴往哈蘭去？',a:['以掃生氣，雅各也要到母舅家去','他要去埃及買糧食','他想去吾珥建城'],correct:0,reward:'onyx',ref:'創世記 27:18–28:5',lesson:'雅各得到祝福的過程充滿欺騙，也造成兄弟之間嚴重的傷害。'},
{id:'j-bethel',char:'jacob',place:'bethel',title:'夢見通天的梯子',story:'雅各離家後，在路上拿一塊石頭當枕頭睡覺。他夢見一座梯子立在地上，梯頂通天，神的使者在梯子上上去下來。',q:'雅各醒來後，把這地方叫作什麼？',a:['伯特利','利河伯','瑪哈念'],correct:0,reward:'gold',ref:'創世記 28:10–22',lesson:'「伯特利」有神的殿之意。孤單離家的雅各在這裡聽見神的應許。'},
{id:'j-rachel',char:'jacob',place:'haran',title:'井旁遇見拉結',story:'雅各到了東方，看見牧人和羊群聚集在井旁。拉結帶著父親拉班的羊來時，雅各上前把井口的大石頭移開，讓羊喝水。',q:'雅各在井旁遇見了誰？',a:['拉結','撒拉','利百加'],correct:0,reward:'pearl',ref:'創世記 29:1–14',lesson:'漫長的旅程之後，雅各終於找到母親的親族。'},
{id:'j-leah',char:'jacob',place:'haran',title:'想娶拉結，卻先娶利亞',story:'雅各愛拉結，答應為她服事拉班七年。婚禮之後，他才發現拉班先把姐姐利亞給了他。雅各後來又為拉結服事七年。',q:'雅各第一次婚禮後發現自己先娶了誰？',a:['利亞','拉結','辟拉'],correct:0,reward:'onyx',ref:'創世記 29:15–30',lesson:'曾經用欺騙得到祝福的雅各，在拉班家也經歷了被欺騙的滋味。'},
{id:'j-family',char:'jacob',place:'haran',title:'一個大家庭形成了',story:'雅各在巴旦亞蘭生活多年，利亞、拉結和兩位使女為他生兒育女。這個家庭後來成為以色列十二支派故事的起點。',q:'雅各的眾子後來和什麼有密切關係？',a:['以色列十二支派','埃及十二位法老','迦南十二座城'],correct:0,reward:'gold',ref:'創世記 29:31–30:24',lesson:'神的應許正透過一個逐漸擴大的家庭繼續向前發展。'},
{id:'j-gilead',char:'jacob',place:'gilead',title:'離開拉班',story:'雅各帶著家人和牲畜離開拉班。拉班追上他們，雙方最後在基列山地立下石堆作記號，約定彼此不可越過石堆去傷害對方。',q:'雅各和拉班最後用什麼作為彼此立約的記號？',a:['石堆','金冠冕','一艘船'],correct:0,reward:'onyx',ref:'創世記 31章',lesson:'長年的衝突最後以立約分開告一段落，雅各繼續踏上回家的路。'},
{id:'j-mahanaim',char:'jacob',place:'mahanaim',title:'哥哥帶著四百人來了',story:'雅各聽見以掃帶著四百人迎面而來，非常害怕。他把人和牲畜分隊，又向神禱告，並預備禮物送給以掃。',q:'雅各害怕以掃時，除了安排隊伍和禮物，還做了什麼？',a:['向神禱告','立刻逃回哈蘭','攻打附近的城'],correct:0,reward:'pearl',ref:'創世記 32:1–21',lesson:'雅各在害怕中想辦法預備，也向神承認自己的不配並求神拯救。'},
{id:'j-peniel',char:'jacob',place:'peniel',title:'雅博渡口的一夜',story:'夜裡，雅各獨自留下，和一位神祕人物摔跤直到天快亮。那人為雅各祝福，並給他一個新的名字。',q:'雅各得到的新名字是什麼？',a:['以色列','亞伯拉罕','以東'],correct:0,reward:'gold',ref:'創世記 32:22–32',lesson:'「以色列」成為雅各的新名字，也成為後來神百姓的重要名稱。'},
{id:'j-esau',char:'jacob',place:'succoth',title:'兄弟再次相見',story:'雅各遠遠看見以掃來了，就一連七次俯伏在地。沒想到以掃跑來迎接他，抱住他，兩兄弟一起哭了。',q:'雅各最害怕的相見，最後發生了什麼？',a:['以掃抱住雅各，兄弟相見','以掃立刻攻打雅各','雅各又逃回拉班家'],correct:0,reward:'gold',ref:'創世記 33:1–17',lesson:'多年以前受傷分離的兄弟，終於再次見面。這是一個珍貴的和好時刻。'},
{id:'j-return-bethel',char:'jacob',place:'bethel',title:'重新回到伯特利',story:'神吩咐雅各回到伯特利築壇。雅各要全家除掉外邦神像、潔淨自己，再一起上伯特利。神也再次向他顯現，確認他的名字是以色列。',q:'回伯特利以前，雅各要家人先做什麼？',a:['除掉外邦神像並潔淨自己','準備攻城武器','回哈蘭找拉班'],correct:0,reward:'gold',ref:'創世記 35:1–15',lesson:'伯特利曾是雅各逃難時遇見神的地方；多年後，他帶著全家重新回到這裡敬拜神。'}
];
const charInfo={abraham:{name:'亞伯拉罕'},isaac:{name:'以撒'},jacob:{name:'雅各'}};
function portraitHTML(c){return '<span class="portrait '+c+'"><i class="body"></i><i class="robe"></i><i class="head"></i><i class="hair"></i><i class="beard"></i></span>'}
let active='abraham',positions={abraham:{x:1780,y:230},isaac:{x:900,y:1160},jacob:{x:930,y:1090}},moving={x:0,y:0},completed=new Set(),loot={pearl:0,onyx:0,gold:0},locked=false,currentEvent=null;
const map=document.getElementById('map'),wrap=document.getElementById('mapWrap'),char=document.getElementById('char');
document.querySelector('.egypt').style.cssText='left:330px;top:1260px';document.querySelector('.canaan').style.cssText='left:930px;top:720px';document.querySelector('.meso').style.cssText='left:1980px;top:690px';document.querySelector('.seaLabel').style.cssText='left:360px;top:610px';
const geos=[
['range','',1260,300],['range','',1390,360],['range','',1480,500],
['range','',770,820],['range','',720,1180],['range','',1180,1020],
['oasis','',520,1160],['oasis','',1090,870],['oasis','',1880,760],
['city','',1760,190],['city','',2180,1070],['city','',980,610],['city','',900,1050],
['label','南地',780,1120],['label','巴旦亞蘭',1660,360],['label','亞蘭',1390,430],['label','基列',1230,535],['label','約旦河',1130,675],['label','死海',1150,875],['label','尼羅河',330,1190],['label','兩河流域',2030,650]
];
geos.forEach(g=>{const e=document.createElement('div');e.className=g[0]==='label'?'geoLabel':'geo '+g[0];e.textContent=g[1];e.style.left=g[2]+'px';e.style.top=g[3]+'px';map.appendChild(e)});
function addRoute(x1,y1,x2,y2){const e=document.createElement('div'),dx=x2-x1,dy=y2-y1;e.className='geo route';e.style.left=x1+'px';e.style.top=y1+'px';e.style.width=Math.hypot(dx,dy)+'px';e.style.transform='rotate('+Math.atan2(dy,dx)+'rad)';map.appendChild(e)}
[[2200,1110,1780,230],[1780,230,1010,650],[1010,650,1000,760],[1000,760,430,1240],[430,1240,1000,760],[1000,760,980,955],[980,955,930,1090],[930,1090,1010,835],[930,1090,1000,760],[1000,760,1780,230],[1780,230,1210,570],[1210,570,1140,650],[1140,650,1175,705],[1175,705,1105,735],[1105,735,1000,760]].forEach(r=>addRoute(...r));
places.forEach(p=>{const e=document.createElement('div');e.className='place'+(p.mountain?' mountain':'');e.dataset.place=p.id;e.id='place-'+p.id;e.style.left=p.x+'px';e.style.top=p.y+'px';e.innerHTML='<div class="dot">'+(p.mountain?'<i class="mountIcon"></i>':'')+'</div><span>'+p.name+'</span>';map.appendChild(e)});
let camera={x:0,y:0};
const miniDot=document.getElementById('miniDot'),miniView=document.getElementById('miniView');
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function updateCamera(){
 const p=positions[active],vw=wrap.clientWidth,vh=wrap.clientHeight;
 const sx=p.x-camera.x,sy=p.y-camera.y,left=vw/3,right=vw*2/3,top=vh/3,bottom=vh*2/3;
 if(sx<left)camera.x=p.x-left;if(sx>right)camera.x=p.x-right;
 if(sy<top)camera.y=p.y-top;if(sy>bottom)camera.y=p.y-bottom;
 camera.x=clamp(camera.x,0,Math.max(0,WORLD.w-vw));camera.y=clamp(camera.y,0,Math.max(0,WORLD.h-vh));
 map.style.transform='translate('+(-camera.x)+'px,'+(-camera.y)+'px)';
 char.style.left=(p.x-camera.x)+'px';char.style.top=(p.y-camera.y)+'px';
 miniDot.style.left=(p.x/WORLD.w*100)+'%';miniDot.style.top=(p.y/WORLD.h*100)+'%';
 miniView.style.left=(camera.x/WORLD.w*100)+'%';miniView.style.top=(camera.y/WORLD.h*100)+'%';
 miniView.style.width=(Math.min(vw,WORLD.w)/WORLD.w*100)+'%';miniView.style.height=(Math.min(vh,WORLD.h)/WORLD.h*100)+'%';
}
function updatePlaceStates(){
 document.querySelectorAll('.place').forEach(el=>{const id=el.dataset.place,related=events.filter(e=>e.char===active&&e.place===id),unfinished=related.filter(e=>!completed.has(e.id));el.classList.toggle('relevant',unfinished.length>0);el.classList.toggle('done',related.length>0&&unfinished.length===0);el.classList.remove('near')});
}
function render(){document.getElementById('charTag').textContent=charInfo[active].name;document.getElementById('charFace').innerHTML=portraitHTML(active);updateCamera();updatePlaceStates()}
function switchChar(c){active=c;camera.x=positions[c].x-wrap.clientWidth/2;camera.y=positions[c].y-wrap.clientHeight/2;document.querySelectorAll('.pick').forEach(b=>b.classList.toggle('active',b.dataset.char===c));render();document.getElementById('hint').textContent='現在探索：'+charInfo[c].name+'｜發光的地點可能藏著他的事件'}
document.querySelectorAll('.pick').forEach(b=>b.addEventListener('click',()=>switchChar(b.dataset.char)));window.addEventListener('resize',render);
function tick(){if(!locked&&(moving.x||moving.y)){const p=positions[active];p.x=clamp(p.x+moving.x*4.2,24,WORLD.w-24);p.y=clamp(p.y+moving.y*4.2,35,WORLD.h-35);render();checkTrigger()}requestAnimationFrame(tick)}tick();
const joy=document.getElementById('joy'),stick=document.getElementById('stick');let joyActive=false;
function joyMove(clientX,clientY){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=clientX-cx,dy=clientY-cy,max=r.width*.31,d=Math.hypot(dx,dy)||1,k=Math.min(1,max/d),sx=dx*k,sy=dy*k;stick.style.transform='translate('+sx+'px,'+sy+'px)';moving={x:sx/max,y:sy/max}}
function joyEnd(){joyActive=false;moving={x:0,y:0};stick.style.transform='translate(0,0)'}
function startJoy(x,y){if(locked)return;joyActive=true;joyMove(x,y)}
function moveJoy(x,y){if(joyActive)joyMove(x,y)}
joy.addEventListener('pointerdown',e=>{e.preventDefault();startJoy(e.clientX,e.clientY);try{joy.setPointerCapture(e.pointerId)}catch(_){}});
joy.addEventListener('pointermove',e=>{if(joyActive){e.preventDefault();moveJoy(e.clientX,e.clientY)}});
joy.addEventListener('pointerup',joyEnd);joy.addEventListener('pointercancel',joyEnd);
joy.addEventListener('mousedown',e=>{e.preventDefault();startJoy(e.clientX,e.clientY)});
window.addEventListener('mousemove',e=>moveJoy(e.clientX,e.clientY));
window.addEventListener('mouseup',joyEnd);
joy.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];if(t)startJoy(t.clientX,t.clientY)},{passive:false});
joy.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0];if(t)moveJoy(t.clientX,t.clientY)},{passive:false});
joy.addEventListener('touchend',joyEnd,{passive:false});
window.addEventListener('keydown',e=>{if(locked)return;const k=e.key;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(k))e.preventDefault();if(k==='ArrowLeft')moving.x=-1;if(k==='ArrowRight')moving.x=1;if(k==='ArrowUp')moving.y=-1;if(k==='ArrowDown')moving.y=1});
window.addEventListener('keyup',e=>{if(e.key.includes('Arrow'))moving={x:0,y:0}});
function checkTrigger(){document.querySelectorAll('.place').forEach(el=>el.classList.remove('near'));for(const p of places){const cp=positions[active],d=Math.hypot(cp.x-p.x,cp.y-p.y),el=document.getElementById('place-'+p.id);if(d<115&&events.some(e=>e.char===active&&e.place===p.id&&!completed.has(e.id)))el&&el.classList.add('near');if(d<58){const ev=events.find(e=>e.char===active&&e.place===p.id&&!completed.has(e.id));if(ev){openEvent(ev);break}}}}

const storyArt={
 abraham:['./assets/abraham_story_asset.webp','../exodus/og-cover.png'],
 isaac:['./assets/isaac-story.webp','../exodus/og-cover.png'],
 jacob:['./assets/jacob-story.webp','../exodus/og-cover.png']
};
function storyChibi(c){
 const sources=storyArt[c]||storyArt.abraham;
 return '<picture class="storyPicture"><source srcset="'+sources[0]+'" type="image/webp"><img class="storyCharacter" src="'+sources[1]+'" alt="'+(charInfo[c]?.name||'族長')+' 精緻卡通插圖" draggable="false"></picture>';
}
function eventSceneHTML(ev){
 if(!['abraham','isaac'].includes(ev.char))return '';
 const cls={
  'a-egypt':'egypt','a-covenant':'night','a-sodom':'sodom','a-isaac':'birth','a-moriah':'moriah','a-machpelah':'cave',
  'i-moriah':'moriah','i-rebekah':'','i-twins':'birth','i-gerar':'','i-wells':'wells','i-rehoboth':'rehoboth','i-beer':'beersheba'
 }[ev.id]||'';
 let props='<i class="sun"></i><i class="ground"></i>';
 if(['a-ur','a-haran','a-lot','a-covenant','a-isaac','i-twins','i-gerar','i-beer'].includes(ev.id))props+='<i class="prop tent"></i>';
 if(['a-shechem','a-moriah','i-moriah','i-beer'].includes(ev.id))props+='<i class="prop altarTiny"></i>';
 if(['a-egypt','a-sodom'].includes(ev.id))props+='<i class="prop cityTiny"></i>';
 if(ev.id==='a-covenant')props+='<i class="stars"></i>';
 if(ev.id==='i-rebekah')props+='<i class="prop camelTiny"></i>';
 if(['i-wells','i-rehoboth'].includes(ev.id))props+='<i class="prop wellTiny"></i>';
 if(ev.id==='i-moriah')props+='<i class="prop sheepTiny"></i>';
 return '<div class="sceneArt '+cls+'"><span class="sceneCaption">'+(ev.char==='abraham'?'亞伯拉罕':'以撒')+'的故事插圖</span>'+props+'<div class="hero">'+storyChibi(ev.char)+'</div></div>';
}
function openEvent(ev){locked=true;moving={x:0,y:0};currentEvent=ev;document.getElementById('storyPortrait').innerHTML=portraitHTML(ev.char);document.getElementById('eventBadge').textContent=charInfo[ev.char].name+'的事件';const rewardNames={pearl:'⚪ 珍珠',onyx:'🔶 瑪瑙',gold:'🪙 黃金'};document.getElementById('rewardPreview').textContent='答對這題可獲得：'+rewardNames[ev.reward];document.getElementById('eventWhere').textContent=ev.ref+'｜'+places.find(p=>p.id===ev.place).name;document.getElementById('eventTitle').textContent=ev.title;document.getElementById('eventScene').innerHTML=eventSceneHTML(ev);document.getElementById('eventScene').style.display=['abraham','isaac'].includes(ev.char)?'block':'none';document.getElementById('eventStory').textContent=ev.story;document.getElementById('eventQuestion').textContent=ev.q;const box=document.getElementById('answers');box.innerHTML='';ev.a.forEach((a,i)=>{const b=document.createElement('button');b.className='answer';b.textContent=a;b.onclick=()=>answer(i);box.appendChild(b)});const f=document.getElementById('feedback');f.className='feedback';f.textContent='';document.getElementById('continueBtn').style.display='none';document.getElementById('eventModal').classList.add('show')}
function answer(i){const ev=currentEvent,f=document.getElementById('feedback');if(i===ev.correct){if(!completed.has(ev.id)){completed.add(ev.id);loot[ev.reward]++;updateLoot();updatePlaceStates()}const names={pearl:'珍珠 ⚪',onyx:'瑪瑙 🔶',gold:'黃金 🪙'};f.className='feedback ok';f.textContent='答對了！獲得 '+names[ev.reward]+'。 '+(ev.lesson||'這個事件已收入你的探索紀錄。');document.querySelectorAll('.answer').forEach(b=>b.disabled=true);document.getElementById('continueBtn').style.display='block'}else{f.className='feedback no';f.textContent='再想一想。可以從事件敘述與聖經中的人物行動找線索。'}}
function updateLoot(){['pearl','onyx','gold'].forEach(k=>document.getElementById(k).textContent=loot[k])}
function closeEvent(){document.getElementById('eventModal').classList.remove('show');locked=false;moving={x:0,y:0};positions[active].x=Math.min(WORLD.w-24,positions[active].x+70);render()}
document.getElementById('continueBtn').onclick=closeEvent;document.getElementById('eventClose').onclick=closeEvent;document.getElementById('eventModal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeEvent()});
function showSummary(){locked=true;document.getElementById('sPearl').textContent=loot.pearl;document.getElementById('sOnyx').textContent=loot.onyx;document.getElementById('sGold').textContent=loot.gold;const chars=['abraham','isaac','jacob'];document.getElementById('summaryProgress').innerHTML=chars.map(c=>{const total=events.filter(e=>e.char===c).length,done=events.filter(e=>e.char===c&&completed.has(e.id)).length;return '<div class="prog"><span>'+charInfo[c].name+'</span><b>'+done+' / '+total+'</b><small>事件</small></div>'}).join('');document.getElementById('summaryText').textContent='已探索 '+completed.size+' 個事件，還有 '+(events.length-completed.size)+' 個事件等待發現。';document.getElementById('summaryModal').classList.add('show')}
document.getElementById('summaryBtn').onclick=showSummary;document.getElementById('summaryModal').addEventListener('click',e=>{if(e.target===e.currentTarget){e.currentTarget.classList.remove('show');locked=false}});
try{camera.x=positions[active].x-wrap.clientWidth/2;camera.y=positions[active].y-wrap.clientHeight/2;render();document.body.dataset.gameReady='true'}catch(err){console.error('Patriarchs init failed:',err);document.getElementById('hint').textContent='遊戲初始化失敗，請重新整理頁面';}
</script></body></html>
