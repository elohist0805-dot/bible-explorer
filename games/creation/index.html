function art(id){
 if(id.startsWith('day')){
   const d=DAYS[Number(id.slice(3))-1];
   const map={1:['light','dark'],2:['sky','water'],3:['land','tree'],4:['sun','moon'],5:['fish','bird'],6:['lion','human1']};
   return '<span class="art">'+map[d.day].map(k=>SVG[k]).join('')+'</span>';
 }
 const key=id==='human'?'human1':id; return '<span class="art">'+(SVG[key]||SVG.light)+'</span>';
}
function cumulativeWorld(day){
 const parts=[];
 if(day>=1){parts.push('<div class="historyArt" style="left:6%;top:7%;width:17%;height:15%">'+art('light')+'</div>')}
 if(day>=2){parts.push('<div class="historyArt" style="left:28%;top:5%;width:25%;height:14%">'+art('sky')+'</div><div class="historyArt" style="left:4%;bottom:2%;width:30%;height:15%">'+art('water')+'</div>')}
 if(day>=3){parts.push('<div class="historyArt" style="left:12%;bottom:18%;width:26%;height:16%">'+art('land')+'</div><div class="historyArt" style="left:31%;bottom:19%;width:16%;height:19%">'+art('tree')+'</div>')}
 if(day>=4){parts.push('<div class="historyArt" style="right:8%;top:6%;width:14%;height:15%">'+art('sun')+'</div><div class="historyArt" style="right:27%;top:10%;width:13%;height:14%">'+art('moon')+'</div><div class="historyArt" style="right:38%;top:2%;width:14%;height:11%">'+art('stars')+'</div>')}
 if(day>=5){parts.push('<div class="historyArt" style="left:58%;bottom:4%;width:15%;height:13%">'+art('fish')+'</div><div class="historyArt" style="left:53%;top:21%;width:18%;height:14%">'+art('bird')+'</div>')}
 return '<div class="historyLayer">'+parts.join('')+'</div>';
}
function loadState(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||{unlocked:0,stars:{}}}catch(e){return{unlocked:0,stars:{}}}}
function saveState(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
function renderProgress(){$('#progressText').textContent=(levelIndex+1)+'/7';$('#starTotal').textContent=Object.values(state.stars||{}).reduce((a,b)=>a+b,0);$('#progressDots').innerHTML=LEVELS.map((_,i)=>'<span class="step '+(i<levelIndex?'done ':i===levelIndex?'current ':'')+'">'+(i+1)+'</span>').join('');$('#subtitle').textContent='第'+(levelIndex+1)+'關・'+LEVELS[levelIndex].title.replace(/^第.+?：/,'')}
function setMessage(text,type='info'){const m=$('#message');m.className='message show '+type;m.textContent=text;clearTimeout(setMessage.t);setMessage.t=setTimeout(()=>m.className='message',2500)}
function renderLevel(){mistakes=0;hintUsed=false;placedCount=0;selectedItem=null;$('#nextBtn').disabled=true;const lv=LEVELS[levelIndex];$('#levelTitle').textContent=lv.title;$('#levelInstruction').textContent=lv.instruction;$('#chapterVerse').textContent=lv.verse||'';renderProgress();lv.type==='order'?renderOrder():renderScene(lv)}
function renderOrder(){const shuffled=[...DAYS].sort(()=>Math.random()-.5);$('#gameArea').innerHTML='<div class="workspace"><div class="orderGrid">'+DAYS.map(d=>'<div class="orderSlot dropzone-order" data-day="'+d.day+'"><strong>第 '+d.day+' 日</strong><span class="hint">把正確的創造卡放到這裡</span></div>').join('')+'</div><aside class="tray"><h3>創造卡</h3><p>拖曳卡片；手機也可以點一下卡片，再點目的地。</p><div class="items">'+shuffled.map(d=>itemHTML({id:'day'+d.day,emoji:d.emoji,name:d.summary,day:d.day,ok:true})).join('')+'</div></aside></div>';bindItems();document.querySelectorAll('.dropzone-order').forEach(z=>z.addEventListener('click',()=>{if(selectedItem)attemptOrderDrop(selectedItem,z)}))}
function sceneClass(day){return day===1?'world dark':day===2?'world dawn':'world'}
function renderScene(lv){const targets=TARGET_LAYOUTS[lv.day].map(t=>'<div class="dropzone" data-target="'+t[0]+'" style="left:'+t[1]+';top:'+t[2]+';width:'+t[3]+';height:'+t[4]+'"><span>'+targetLabel(t[0],lv.day)+'</span></div>').join('');$('#gameArea').innerHTML='<div class="workspace"><div class="'+sceneClass(lv.day)+'">'+cumulativeWorld(lv.day-1)+'<span class="layerLabel skyLabel">天空</span><span class="layerLabel landLabel">陸地</span><span class="layerLabel seaLabel">水域</span><div class="targets">'+targets+'</div></div><aside class="tray"><h3>創造素材</h3><p>拖曳到世界中。放錯的東西會回到素材盤。</p><div class="items">'+lv.items.map(itemHTML).join('')+'</div></aside></div>';bindItems();document.querySelectorAll('.dropzone').forEach(z=>z.addEventListener('click',()=>{if(selectedItem)attemptSceneDrop(selectedItem,z)}))}
function targetLabel(target,day){if(target.startsWith('sky'))return '放在天空';if(target.startsWith('sea'))return '放進水中';if(target.startsWith('land'))return '放在地上';if(target.startsWith('center'))return day===1?'讓光照進來':'放在這裡';if(target==='edge')return '黑暗';return '放這裡'}
function itemHTML(it){return '<div class="dragItem" data-id="'+it.id+'" data-name="'+it.name+'" '+(it.day?'data-day="'+it.day+'"':'')+'>'+art(it.id)+'<b>'+it.name+'</b></div>'}
function bindItems(){document.querySelectorAll('.dragItem').forEach(el=>{el.addEventListener('pointerdown',startPointerDrag);el.addEventListener('click',()=>{if(!el.classList.contains('used'))selectItem(el)})})}
function selectItem(el){document.querySelectorAll('.dragItem').forEach(x=>x.style.outline='');selectedItem=el;el.style.outline='4px solid #efbd48';setMessage('已選擇「'+el.dataset.name+'」，請再點一下要放的位置。','info')}
function startPointerDrag(e){const el=e.currentTarget;if(el.classList.contains('used'))return;const ghost=document.createElement('div');ghost.className='ghost';ghost.innerHTML=el.querySelector('.art')?.outerHTML||'';document.body.appendChild(ghost);ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';const move=ev=>{ghost.style.left=ev.clientX+'px';ghost.style.top=ev.clientY+'px';document.querySelectorAll('.dropzone,.dropzone-order').forEach(z=>z.classList.remove('hover'));const hit=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('.dropzone,.dropzone-order');if(hit)hit.classList.add('hover')};const up=ev=>{document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);ghost.remove();document.querySelectorAll('.dropzone,.dropzone-order').forEach(z=>z.classList.remove('hover'));const hit=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('.dropzone,.dropzone-order');if(hit)(LEVELS[levelIndex].type==='order'?attemptOrderDrop(el,hit):attemptSceneDrop(el,hit))};document.addEventListener('pointermove',move);document.addEventListener('pointerup',up,{once:true})}
function attemptOrderDrop(item,slot){if(slot.classList.contains('filled')){mistakes++;setMessage('這一格已經放過了，換一格試試看。','bad');return}if(Number(item.dataset.day)===Number(slot.dataset.day)){slot.classList.add('filled');slot.innerHTML='<strong>第 '+slot.dataset.day+' 日</strong><div class="placed">'+art('day'+slot.dataset.day)+'<br><small>'+item.dataset.name+'</small></div>';item.classList.add('used');item.style.outline='';selectedItem=null;placedCount++;setMessage('答對了！這就是第 '+slot.dataset.day+' 日的創造。','good');if(placedCount===6)finishLevel()}else{mistakes++;setMessage('順序還不對喔，再想想這件事是在第幾日。','bad')}}
function attemptSceneDrop(item,zone){const lv=LEVELS[levelIndex],data=lv.items.find(x=>x.id===item.dataset.id);if(zone.classList.contains('filled')){mistakes++;setMessage('這個位置已經完成了，試試別的位置。','bad');return}if(!data?.ok){mistakes++;setMessage('「'+item.dataset.name+'」不是這一天才創造的喔！','bad');return}if(data.target!==zone.dataset.target){mistakes++;setMessage('東西選對了，但位置還不對。看看它應該在天空、陸地，還是水中？','bad');return}zone.classList.add('filled');zone.innerHTML='<div class="placed">'+art(data.id)+'<br><small>'+item.dataset.name+'</small></div>';item.classList.add('used');item.style.outline='';selectedItem=null;placedCount++;setMessage('放對了！「'+item.dataset.name+'」加入世界。','good');if(placedCount===lv.items.filter(x=>x.ok).length)finishLevel()}
function scoreStars(){if(hintUsed||mistakes>=3)return 1;if(mistakes>=1)return 2;return 3}
function finishLevel(){const stars=scoreStars();state.stars[levelIndex]=Math.max(state.stars[levelIndex]||0,stars);state.unlocked=Math.max(state.unlocked,Math.min(levelIndex+1,6));saveState();renderProgress();$('#nextBtn').disabled=false;$('#modalStars').textContent='⭐'.repeat(stars)+'☆'.repeat(3-stars);if(levelIndex===0){$('#modalIcon').textContent='📖';$('#modalTitle').textContent='順序完成！';$('#modalText').textContent='你已經排好六日創造的順序。接下來，親手把每一天的創造放進世界吧！'}else if(levelIndex===6){$('#modalIcon').textContent='🌍';$('#modalTitle').textContent='創造世界完成！';$('#modalText').textContent='從光、天空、陸地，到日月星辰、魚鳥、走獸與人，你完成了六日創造的旅程。';$('#modalNextBtn').textContent='回到第一關'}else{$('#modalIcon').textContent=DAYS[levelIndex-1]?.emoji?.slice(0,2)||'✨';$('#modalTitle').textContent='這一天完成了！';$('#modalText').textContent='做得很好！你完成了這一日的創造，可以繼續下一天。'}$('#completeModal').classList.add('show')}
function nextLevel(){if(levelIndex<6)levelIndex++;else levelIndex=0;$('#completeModal').classList.remove('show');renderLevel()}
$('#nextBtn').addEventListener('click',nextLevel);$('#modalNextBtn').addEventListener('click',nextLevel);$('#replayBtn').addEventListener('click',()=>{$('#completeModal').classList.remove('show');renderLevel()});$('#resetBtn').addEventListener('click',renderLevel);
$('#hintBtn').addEventListener('click',()=>{hintUsed=true;const lv=LEVELS[levelIndex];if(lv.type==='order'){const next=DAYS.find(d=>!document.querySelector('.orderSlot[data-day="'+d.day+'"]').classList.contains('filled'));setMessage(next?'提示：第 '+next.day+' 日是「'+next.summary+'」。':'你已經完成囉！','info')}else{const next=lv.items.find(x=>x.ok&&!document.querySelector('.dragItem[data-id="'+x.id+'"]').classList.contains('used'));setMessage(next?'提示：「'+next.name+'」要放在「'+targetLabel(next.target,lv.day)+'」的位置。':'這一關快完成了！','info')}});
renderLevel();
</script>
