 lion:'<svg viewBox="0 0 120 90"><circle cx="60" cy="43" r="30" fill="#c8843f"/><circle cx="60" cy="44" r="22" fill="#e8b166"/><circle cx="52" cy="40" r="3" fill="#2d332f"/><circle cx="68" cy="40" r="3" fill="#2d332f"/><path d="M56 49h8l-4 5z" fill="#754528"/><path d="M50 57q10 7 20 0" fill="none" stroke="#754528" stroke-width="3"/><circle cx="39" cy="24" r="8" fill="#c8843f"/><circle cx="81" cy="24" r="8" fill="#c8843f"/></svg>',
 cow:'<svg viewBox="0 0 120 90"><rect x="29" y="26" width="62" height="45" rx="20" fill="#f4eee1"/><path d="M38 30q9-12 16 0M67 29q11-13 18 1" fill="#65594a"/><circle cx="45" cy="43" r="7" fill="#735d4c"/><circle cx="75" cy="56" r="8" fill="#735d4c"/><circle cx="53" cy="49" r="3" fill="#2c302f"/><circle cx="70" cy="49" r="3" fill="#2c302f"/><ellipse cx="61" cy="61" rx="15" ry="8" fill="#e8b3a1"/></svg>',
 human1:'<svg viewBox="0 0 120 90"><circle cx="60" cy="23" r="14" fill="#d69b70"/><path d="M44 42q16-12 32 0l7 33H37z" fill="#8b6b45"/><path d="M44 47l-20 18M76 47l20 18" stroke="#d69b70" stroke-width="7" stroke-linecap="round"/><path d="M48 74l-8 13M72 74l8 13" stroke="#7a5538" stroke-width="8" stroke-linecap="round"/></svg>',
 human2:'<svg viewBox="0 0 120 90"><circle cx="60" cy="23" r="14" fill="#d89d73"/><path d="M45 14q15-15 30 2q-5 2-4 12H48q2-9-3-14" fill="#5f4435"/><path d="M44 42q16-12 32 0l10 34H34z" fill="#7f9a59"/><path d="M44 47l-20 18M76 47l20 18" stroke="#d89d73" stroke-width="7" stroke-linecap="round"/></svg>',
 flower:'<svg viewBox="0 0 120 90"><path d="M60 45v34" stroke="#5d944f" stroke-width="6"/><g fill="#ee8f99"><circle cx="60" cy="31" r="10"/><circle cx="47" cy="38" r="10"/><circle cx="73" cy="38" r="10"/><circle cx="52" cy="24" r="10"/><circle cx="68" cy="24" r="10"/></g><circle cx="60" cy="32" r="8" fill="#f5cf57"/></svg>'
};
function art(id){
 if(id.startsWith('day')){
   const d=DAYS[Number(id.slice(3))-1];
   const map={1:['light','dark'],2:['sky','water'],3:['land','tree'],4:['sun','moon'],5:['fish','bird'],6:['lion','human1']};
   return '<span class="art">'+map[d.day].map(k=>SVG[k]).join('')+'</span>';
 }
 const key=id==='human'?'human1':id; return '<span class="art">'+(SVG[key]||SVG.light)+'</span>';
}
function cumulativeWorld(day){
 const parts=[];
 if(day>=1){parts.push('<div class="historyArt" style="left:6%;top:7%;width:17%;height:15%">'+art('light')+'</div>')}
 if(day>=2){parts.push('<div class="historyArt" style="left:28%;top:5%;width:25%;height:14%">'+art('sky')+'</div><div class="historyArt" style="left:4%;bottom:2%;width:30%;height:15%">'+art('water')+'</div>')}
 if(day>=3){parts.push('<div class="historyArt" style="left:12%;bottom:18%;width:26%;height:16%">'+art('land')+'</div><div class="historyArt" style="left:31%;bottom:19%;width:16%;height:19%">'+art('tree')+'</div>')}
 if(day>=4){parts.push('<div class="historyArt" style="right:8%;top:6%;width:14%;height:15%">'+art('sun')+'</div><div class="historyArt" style="right:27%;top:10%;width:13%;height:14%">'+art('moon')+'</div><div class="historyArt" style="right:38%;top:2%;width:14%;height:11%">'+art('stars')+'</div>')}
 if(day>=5){parts.push('<div class="historyArt" style="left:58%;bottom:4%;width:15%;height:13%">'+art('fish')+'</div><div class="historyArt" style="left:53%;top:21%;width:18%;height:14%">'+art('bird')+'</div>')}
 return '<div class="historyLayer">'+parts.join('')+'</div>';
}
function loadState(){try{const s=JSON.parse(localStorage.getItem(STORAGE_KEY))||{};return {unlocked:s.unlocked||0,stars:s.stars||{},layouts:s.layouts||{}}}catch(e){return{unlocked:0,stars:{},layouts:{}}}}
function saveState(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
function renderProgress(){$('#progressText').textContent=(levelIndex+1)+'/7';$('#starTotal').textContent=Object.values(state.stars||{}).reduce((a,b)=>a+b,0);$('#progressDots').innerHTML=LEVELS.map((_,i)=>'<span class="step '+(i<levelIndex?'done ':i===levelIndex?'current ':'')+'">'+(i+1)+'</span>').join('');$('#subtitle').textContent='第'+(levelIndex+1)+'關・'+LEVELS[levelIndex].title.replace(/^第.+?：/,'')}
function setMessage(text,type='info'){const m=$('#message');m.className='message show '+type;m.textContent=text;clearTimeout(setMessage.t);setMessage.t=setTimeout(()=>m.className='message',2500)}
function renderLevel(){mistakes=0;hintUsed=false;placedCount=0;selectedItem=null;currentObjects=[];actionHistory=[];$('#nextBtn').disabled=true;const lv=LEVELS[levelIndex];$('#checkBtn').style.display=lv.type==='scene'?'inline-block':'none';$('#undoBtn').style.display=lv.type==='scene'?'inline-block':'none';$('#levelTitle').textContent=lv.title;$('#levelInstruction').textContent=lv.instruction;$('#chapterVerse').textContent=lv.verse||'';renderProgress();lv.type==='order'?renderOrder():renderScene(lv)}
function renderOrder(){const shuffled=[...DAYS].sort(()=>Math.random()-.5);$('#gameArea').innerHTML='<div class="workspace"><div class="orderGrid">'+DAYS.map(d=>'<div class="orderSlot dropzone-order" data-day="'+d.day+'"><strong>第 '+d.day+' 日</strong><span class="hint">把正確的創造卡放到這裡</span></div>').join('')+'</div><aside class="tray"><h3>創造卡</h3><p>拖曳卡片；手機也可以點一下卡片，再點目的地。</p><div class="items">'+shuffled.map(d=>itemHTML({id:'day'+d.day,emoji:d.emoji,name:d.summary,day:d.day,ok:true})).join('')+'</div></aside></div>';bindItems();document.querySelectorAll('.dropzone-order').forEach(z=>z.addEventListener('click',()=>{if(selectedItem)attemptOrderDrop(selectedItem,z)}))}
function sceneClass(day){return day===1?'world dark':day===2?'world dawn':'world'}
function zoneFromPoint(y){if(y<46)return 'sky';if(y>=76)return 'water';return 'land'}
function savedWorld(day){
 const chunks=[];
 for(let d=1;d<=day;d++){
   const arr=state.layouts?.[d];
   if(Array.isArray(arr)&&arr.length){
     arr.forEach(o=>chunks.push('<div class="historyArt" style="left:'+o.x+'%;top:'+o.y+'%;width:13%;height:13%;transform:translate(-50%,-50%)">'+art(o.id)+'</div>'));
   }else chunks.push(cumulativeWorld(d).replace('<div class="historyLayer">','').replace(/<\/div>$/,''));
 }
 return '<div class="historyLayer">'+chunks.join('')+'</div>';
}
function renderScene(lv){
 currentObjects=[];actionHistory=[];
 $('#gameArea').innerHTML='<div class="workspace"><div class="'+sceneClass(lv.day)+'" id="worldCanvas">'+savedWorld(lv.day-1)+'<div class="zoneGuide sky"><span>天空區</span></div><div class="zoneGuide land"><span>陸地區</span></div><div class="zoneGuide water"><span>水域區</span></div><div class="freeCanvas" id="freeCanvas"></div></div><aside class="tray"><h3>Q版創造素材</h3><p>每種素材最多可放 7 個。拖到任何位置自由布置；點素材後也可以再點畫面放置。</p><div class="items">'+lv.items.map(itemHTML).join('')+'</div><div class="conceptPanel" id="conceptPanel"></div></aside></div>';
 bindItems();bindCanvas();updateSceneUI();
}
function itemHTML(it){
 const order=it.day?' data-day="'+it.day+'"':'';
 const count=LEVELS[levelIndex]?.type==='scene'?'<span class="countBadge" data-count="'+it.id+'">0 / 7</span>':'';
 return '<div class="dragItem" data-id="'+it.id+'" data-name="'+it.name+'"'+order+'>'+count+art(it.id)+'<b>'+it.name+'</b></div>';
}
function bindItems(){
 document.querySelectorAll('.dragItem').forEach(el=>{
   el.addEventListener('pointerdown',startPointerDrag);
   el.addEventListener('click',()=>{if(LEVELS[levelIndex].type==='order'){if(!el.classList.contains('used'))selectItem(el)}else if(!el.classList.contains('limit'))selectItem(el)});
 });
}
function selectItem(el){
 document.querySelectorAll('.dragItem').forEach(x=>x.style.outline='');
 selectedItem=el;el.style.outline='4px solid #efbd48';
 setMessage('已選擇「'+el.dataset.name+'」，現在可以點主畫面任意位置放下。','info');
}
function startPointerDrag(e){
 const el=e.currentTarget;if(el.classList.contains('used')||el.classList.contains('limit'))return;
 const ghost=document.createElement('div');ghost.className='ghost';ghost.innerHTML=el.querySelector('.art')?.outerHTML||'';document.body.appendChild(ghost);
 ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';let moved=false;
 const move=ev=>{if(Math.hypot(ev.clientX-e.clientX,ev.clientY-e.clientY)>6)moved=true;ghost.style.left=ev.clientX+'px';ghost.style.top=ev.clientY+'px'};
 const up=ev=>{document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);ghost.remove();if(!moved)return;
   if(LEVELS[levelIndex].type==='order'){const hit=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('.dropzone-order');if(hit)attemptOrderDrop(el,hit)}
   else{const canvas=$('#worldCanvas'),r=canvas?.getBoundingClientRect();if(r&&ev.clientX>=r.left&&ev.clientX<=r.right&&ev.clientY>=r.top&&ev.clientY<=r.bottom)placeSceneItem(el.dataset.id,(ev.clientX-r.left)/r.width*100,(ev.clientY-r.top)/r.height*100)}
 };
 document.addEventListener('pointermove',move);document.addEventListener('pointerup',up,{once:true});
}
function bindCanvas(){
 const canvas=$('#worldCanvas');
 canvas.addEventListener('click',e=>{
   if(e.target.closest('.sceneObject')||!selectedItem)return;
   const r=canvas.getBoundingClientRect();placeSceneItem(selectedItem.dataset.id,(e.clientX-r.left)/r.width*100,(e.clientY-r.top)/r.height*100);
 });
}
function placeSceneItem(id,x,y){
 const lv=LEVELS[levelIndex],data=lv.items.find(i=>i.id===id);if(!data)return;
 const used=currentObjects.filter(o=>o.id===id).length;if(used>=7){setMessage('「'+data.name+'」已經放滿 7 個囉！','bad');return}
 x=Math.max(6,Math.min(94,x));y=Math.max(7,Math.min(93,y));
 const zone=zoneFromPoint(y),obj={uid:Date.now()+Math.random(),id,name:data.name,x,y,zone,ok:data.ok,expected:data.zone||'any'};
 currentObjects.push(obj);actionHistory.push({type:'add',uid:obj.uid});renderObjects();updateSceneUI();
 if(data.ok&&conceptCorrect(obj))setMessage('很好！「'+data.name+'」放在合理的位置。','good');
 else if(data.ok)setMessage('可以放這裡，但想想看它更適合天空、陸地還是水域。','info');
 else setMessage('這個素材不是今天的創造重點；你可以保留觀察，也可以刪掉。','bad');
}
function conceptCorrect(o){return o.ok&&(o.expected==='any'||o.expected===o.zone)}
function renderObjects(){
 const box=$('#freeCanvas');if(!box)return;
 box.innerHTML=currentObjects.map(o=>'<div class="sceneObject '+(conceptCorrect(o)?'':'badPlace')+'" data-uid="'+o.uid+'" style="left:'+o.x+'%;top:'+o.y+'%">'+art(o.id)+'<button class="removeObj" type="button" aria-label="移除'+o.name+'">×</button></div>').join('');
 box.querySelectorAll('.removeObj').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();removeObject(Number(b.parentElement.dataset.uid))}));
 box.querySelectorAll('.sceneObject').forEach(el=>enableObjectDrag(el));
}
function enableObjectDrag(el){
 el.addEventListener('pointerdown',e=>{
   if(e.target.closest('.removeObj'))return;
   const uid=Number(el.dataset.uid),canvas=$('#worldCanvas'),r=canvas.getBoundingClientRect();let moved=false;
   const move=ev=>{moved=true;const x=Math.max(6,Math.min(94,(ev.clientX-r.left)/r.width*100)),y=Math.max(7,Math.min(93,(ev.clientY-r.top)/r.height*100));el.style.left=x+'%';el.style.top=y+'%'};
   const up=ev=>{document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);if(!moved)return;const o=currentObjects.find(x=>x.uid===uid);if(o){o.x=Math.max(6,Math.min(94,(ev.clientX-r.left)/r.width*100));o.y=Math.max(7,Math.min(93,(ev.clientY-r.top)/r.height*100));o.zone=zoneFromPoint(o.y);actionHistory.push({type:'move',uid});renderObjects();updateSceneUI()}};
   document.addEventListener('pointermove',move);document.addEventListener('pointerup',up,{once:true});
 });
}
function removeObject(uid){
 const i=currentObjects.findIndex(o=>o.uid===uid);if(i<0)return;const removed=currentObjects[i];currentObjects.splice(i,1);actionHistory.push({type:'remove',obj:removed});renderObjects();updateSceneUI();
}
function updateSceneUI(){
 const lv=LEVELS[levelIndex];if(lv.type!=='scene')return;
 lv.items.forEach(it=>{const n=currentObjects.filter(o=>o.id===it.id).length,el=document.querySelector('[data-count="'+it.id+'"]'),card=document.querySelector('.dragItem[data-id="'+it.id+'"]');if(el)el.textContent=n+' / 7';if(card)card.classList.toggle('limit',n>=7)});
 const panel=$('#conceptPanel');if(panel)panel.innerHTML=lv.items.filter(i=>i.ok).map(it=>{const n=currentObjects.filter(o=>o.id===it.id&&conceptCorrect(o)).length,ok=n>=it.min;return '<span class="conceptChip '+(ok?'ok':'')+'">'+it.name+' '+n+'/'+it.min+'</span>'}).join('');
}
function checkScene(){
 const lv=LEVELS[levelIndex];if(lv.type!=='scene')return;
 const missing=lv.items.filter(i=>i.ok).filter(it=>currentObjects.filter(o=>o.id===it.id&&conceptCorrect(o)).length<it.min);
 const wrong=currentObjects.filter(o=>!conceptCorrect(o));
 if(missing.length){mistakes++;setMessage('還差一些概念：'+missing.map(x=>x.name+'至少 '+x.min+' 個').join('、')+'。','bad');return}
 const stars=hintUsed?1:(wrong.length===0?3:wrong.length<=2?2:1);
 finishLevel(stars);
}
function attemptOrderDrop(item,slot){
 if(slot.classList.contains('filled')){mistakes++;setMessage('這一格已經放過了，換一格試試看。','bad');return}
 if(Number(item.dataset.day)===Number(slot.dataset.day)){slot.classList.add('filled');slot.innerHTML='<strong>第 '+slot.dataset.day+' 日</strong><div class="placed">'+art('day'+slot.dataset.day)+'<br><small>'+item.dataset.name+'</small></div>';item.classList.add('used');item.style.outline='';selectedItem=null;placedCount++;setMessage('答對了！這就是第 '+slot.dataset.day+' 日的創造。','good');if(placedCount===6)finishLevel()}
 else{mistakes++;setMessage('順序還不對喔，再想想這件事是在第幾日。','bad')}
}
function scoreStars(){if(hintUsed||mistakes>=3)return 1;if(mistakes>=1)return 2;return 3}
function finalPreviewHtml(day){return '<div style="position:relative;height:220px;border-radius:18px;overflow:hidden;margin:14px 0;background:linear-gradient(180deg,#8fd3f3 0 52%,#78aa5d 52% 75%,#3f8fb5 75% 100%);border:1px solid #b99b63">'+savedWorld(day)+'</div>'}
function finishLevel(forcedStars){const stars=forcedStars||scoreStars();if(levelIndex>0){state.layouts=state.layouts||{};state.layouts[LEVELS[levelIndex].day]=currentObjects.map(o=>({id:o.id,x:o.x,y:o.y,zone:o.zone,ok:o.ok,expected:o.expected,name:o.name}))}state.stars[levelIndex]=Math.max(state.stars[levelIndex]||0,stars);state.unlocked=Math.max(state.unlocked,Math.min(levelIndex+1,6));saveState();renderProgress();$('#nextBtn').disabled=false;$('#modalStars').textContent='⭐'.repeat(stars)+'☆'.repeat(3-stars);$('#finalPreview').innerHTML=levelIndex===0?'':finalPreviewHtml(Math.min(levelIndex,6));if(levelIndex===0){$('#modalIcon').textContent='📖';$('#modalTitle').textContent='順序完成！';$('#modalText').textContent='你已經排好六日創造的順序。接下來，親手把每一天的創造放進世界吧！'}else if(levelIndex===6){$('#finalPreview').innerHTML=finalPreviewHtml(6);$('#modalIcon').textContent='🌍';$('#modalTitle').textContent='創造世界完成！';$('#modalText').textContent='從光、天空、陸地，到日月星辰、魚鳥、走獸與人，你完成了六日創造的旅程。';$('#modalNextBtn').textContent='回到第一關'}else{$('#modalIcon').textContent=DAYS[levelIndex-1]?.emoji?.slice(0,2)||'✨';$('#modalTitle').textContent='這一天完成了！';$('#modalText').textContent='做得很好！你完成了這一日的創造，可以繼續下一天。'}$('#completeModal').classList.add('show')}
function nextLevel(){if(levelIndex<6)levelIndex++;else levelIndex=0;$('#completeModal').classList.remove('show');renderLevel()}
$('#nextBtn').addEventListener('click',nextLevel);$('#modalNextBtn').addEventListener('click',nextLevel);$('#replayBtn').addEventListener('click',()=>{$('#completeModal').classList.remove('show');renderLevel()});$('#resetBtn').addEventListener('click',renderLevel);$('#checkBtn').addEventListener('click',()=>{if(LEVELS[levelIndex].type==='order')setMessage('第一關會在六張卡都排對後自動完成。','info');else checkScene()});$('#undoBtn').addEventListener('click',()=>{if(LEVELS[levelIndex].type==='order'){setMessage('第一關請使用「重來本關」重新排列。','info');return}const a=actionHistory.pop();if(!a){setMessage('目前沒有可以復原的步驟。','info');return}if(a.type==='add')currentObjects=currentObjects.filter(o=>o.uid!==a.uid);else if(a.type==='remove')currentObjects.push(a.obj);renderObjects();updateSceneUI()});
$('#hintBtn').addEventListener('click',()=>{hintUsed=true;const lv=LEVELS[levelIndex];if(lv.type==='order'){const next=DAYS.find(d=>!document.querySelector('.orderSlot[data-day="'+d.day+'"]').classList.contains('filled'));setMessage(next?'提示：第 '+next.day+' 日是「'+next.summary+'」。':'你已經完成囉！','info')}else{const need=lv.items.filter(i=>i.ok).find(it=>currentObjects.filter(o=>o.id===it.id&&conceptCorrect(o)).length<it.min);setMessage(need?'提示：今天需要「'+need.name+'」，而且要放在'+(need.zone==='sky'?'天空':need.zone==='water'?'水域':need.zone==='land'?'陸地':'畫面中')+'。':'基本概念已經齊全，可以按「檢查創造」囉！','info')}});
renderLevel();
</script>
