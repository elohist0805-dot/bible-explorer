<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>聖經探險家｜兒童聖經互動遊戲</title>
<meta name="description" content="用遊戲走進聖經故事。從出埃及記到創世記，在互動冒險中探索、思考與學習。">
<link rel="icon" href="/favicon.png">
<style>
:root{--ink:#20334a;--paper:#fbf3df;--gold:#dca64b;--deep:#16324a}
*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at top,#fffaf0 0,#efe1c2 44%,#d2bb8c 100%);min-height:100vh}
main{width:min(1180px,100%);margin:auto;padding:38px 18px 54px}.brand{text-align:center;margin-bottom:30px}.brand .kicker{font-weight:900;letter-spacing:.18em;color:#8b6d36}.brand h1{font-family:Georgia,"Noto Serif TC",serif;font-size:clamp(38px,7vw,72px);margin:8px 0;color:#183c59}.brand p{font-size:clamp(16px,2.5vw,20px);max-width:680px;margin:0 auto;color:#6d6659;line-height:1.7}
.games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}.card{position:relative;overflow:hidden;border-radius:28px;min-height:430px;padding:26px;display:flex;flex-direction:column;justify-content:flex-end;text-decoration:none;color:white;box-shadow:0 18px 48px #5d44265c;border:1px solid #ffffff70;transition:.2s}.card:hover{transform:translateY(-4px)}.card:focus-visible{outline:4px solid #315d87;outline-offset:4px}.exodus{background:linear-gradient(180deg,#74552e22,#241b12dd),radial-gradient(circle at 70% 20%,#f1c76c 0 8%,transparent 9%),linear-gradient(145deg,#cda65b,#7f5f31 52%,#45301f)}.creation{background:linear-gradient(180deg,#173a5a00,#173a5ae8),radial-gradient(circle at 72% 18%,#ffe477 0 6%,transparent 7%),linear-gradient(150deg,#74c4ed 0 38%,#4e9f70 38% 67%,#1d638b 67%)}.art{position:absolute;inset:0;pointer-events:none}.sun{position:absolute;right:9%;top:8%;font-size:76px;filter:drop-shadow(0 6px 12px #0003)}.mount{position:absolute;left:8%;bottom:35%;font-size:72px}.sea{position:absolute;right:4%;bottom:31%;font-size:70px}.animals{position:absolute;left:8%;top:20%;font-size:50px;letter-spacing:-8px}.title{position:relative;z-index:1;text-shadow:0 3px 14px #0008}.title small{display:inline-block;background:#fff2;color:#fff;padding:5px 9px;border-radius:999px;font-weight:900}.title h2{font-size:clamp(28px,4vw,44px);margin:10px 0 4px}.title p{margin:0 0 18px;line-height:1.6;color:#fffde8}.cta{display:inline-block;background:#fff7df;color:#20334a;border-radius:14px;padding:11px 16px;font-weight:900;text-shadow:none}.foot{text-align:center;margin-top:24px;color:#665b49}.counter{display:inline-flex;align-items:center;gap:7px;background:#fff8e7c7;border:1px solid #cdb98c;border-radius:999px;padding:9px 14px;font-weight:800}.note{margin-top:10px;font-size:13px}
@media(max-width:760px){main{padding-top:26px}.games{grid-template-columns:1fr}.card{min-height:360px}}
</style>
</head>
<body>
<main>
<section class="brand"><div class="kicker">BIBLE EXPLORER</div><h1>聖經探險家</h1><p>用互動遊戲走進聖經故事。每一次拖曳、選擇與冒險，都讓孩子更理解經文中的世界。</p></section>
<section class="games" aria-label="遊戲列表">
<a class="card exodus" href="/games/exodus/">
<div class="art"><div class="sun">☀️</div><div class="mount">⛰️</div><div class="sea">🌊</div></div>
<div class="title"><small>冒險闖關</small><h2>出埃及記｜曠野之路</h2><p>跟著以色列人離開埃及，走過曠野，在故事與挑戰中完成旅程。</p><span class="cta">開始冒險 →</span></div>
</a>
<a class="card creation" href="/games/creation/">
<div class="art"><div class="sun">✨</div><div class="animals">🦁 🐟 🕊️</div><div class="sea">🌳</div></div>
<div class="title"><small>拖曳創作</small><h2>創世記｜創造天地</h2><p>先排出六日創造的正確順序，再親手把光、天空、植物、星辰與生命放進世界。</p><span class="cta">開始創造 →</span></div>
</a>
</section>
<footer class="foot"><div class="counter"><span id="visitCount">—</span> 到訪人次</div><div class="note">全站累計・每個瀏覽工作階段計一次</div></footer>
</main>
<script>
(async()=>{const el=document.getElementById('visitCount');const url='/.netlify/functions/visit-count';try{let r;if(sessionStorage.getItem('bibleExplorerVisited')){r=await fetch(url,{cache:'no-store'})}else{r=await fetch(url,{method:'POST',cache:'no-store'});if(r.ok)sessionStorage.setItem('bibleExplorerVisited','1')}if(!r.ok)throw new Error();const d=await r.json();el.textContent=Number(d.count||0).toLocaleString('zh-TW')}catch(e){el.textContent='—'}})();
</script>
</body></html>
